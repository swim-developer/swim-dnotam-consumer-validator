quarkus.application.name=swim-dnotam-consumer-validator
quarkus.application.version=1.0.0
quarkus.native.resources.includes=META-INF/resources/**

quarkus.index-dependency.validator-core.group-id=com.github.swim-developer
quarkus.index-dependency.validator-core.artifact-id=swim-validator-core
quarkus.index-dependency.validator-consumer.group-id=com.github.swim-developer
quarkus.index-dependency.validator-consumer.artifact-id=swim-validator-consumer

# =============================================================================
# DNOTAM Validator Configuration
# =============================================================================
validator.service.default-topic=DigitalNOTAMService
validator.queue.prefix=DNOTAM

# =============================================================================
# HTTP
# =============================================================================
quarkus.http.port=${QUARKUS_HTTP_PORT:8080}
quarkus.http.ssl-port=${QUARKUS_HTTP_SSL_PORT:8443}
quarkus.http.insecure-requests=enabled

# =============================================================================
# OpenAPI / Swagger
# =============================================================================
quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui

mp.openapi.servers=https://swim-dnotam-consumer-validator.apps.ocp4.masales.cloud/swim/v1,http://localhost:8080/swim/v1
mp.openapi.servers.0.description=DNOTAM Consumer Validator (OpenShift)
mp.openapi.servers.1.description=Local Development

mp.openapi.extensions.smallrye.securityScheme.mTLS.type=http
mp.openapi.extensions.smallrye.securityScheme.mTLS.scheme=bearer
mp.openapi.extensions.smallrye.securityScheme.mTLS.bearerFormat=X.509
mp.openapi.extensions.smallrye.securityScheme.mTLS.description=Mutual TLS authentication using EACP (European Aviation Common PKI) certificates. All API calls require a valid X.509 client certificate issued by the EACP.

mp.openapi.extensions.smallrye.info.title=Digital NOTAM (DNOTAM) Subscription and Request Service
mp.openapi.extensions.smallrye.info.version=1.0.0
mp.openapi.extensions.smallrye.info.description=## Service Abstract\n\n\nThe Digital NOTAM Subscription and Request Service allows the service consumer to get aeronautical information in accordance with the Digital NOTAM specification. The aeronautical information conforms to the event scenarios that are supported by Digital NOTAM such as runway closures.\n\n\nThe service consumer may subscribe to the service, specifying the event scenarios of interest. It is also possible to send a direct request to the service to get the aeronautical information. The information returned is in the form of an **AIXM 5.1.1** message. This supports the integration of the latest information into an existing aeronautical information store in the various ATM systems.\n\n\n## Operational Context\n\n\nAir traffic management is defined by ICAO as the *"dynamic, integrated management of air traffic and airspace including air traffic services, airspace management and air traffic flow management - safely, economically and efficiently - through the provision of facilities and seamless services in collaboration with all parties and involving airborne and ground-based functions"*.\n\n\nStakeholders involved in air traffic management need aeronautical data concerning the establishment, condition or change in any aeronautical facility, service, procedure or hazard, the timely knowledge of which is essential for flight operations.\n\n\n## Service Capabilities\n\n\n- **Subscribe to event scenarios** - Receive notifications when aeronautical data changes\n\n- **Request Digital NOTAMs** - Query current state on-demand\n\n- **Distribution** - Automatic delivery when new data is available\n\n- **Subscription management** - Pause, resume, list subscriptions\n\n- **Topic discovery** - Browse available event scenarios\n\n\n## Use Cases\n\n\nThe aeronautical data can be used in:\n\n- **ePIB** (Electronic Pre-flight Information Bulletin)\n\n- **Automatic data verification** and graphical visualization\n\n- **Airspace reservation systems** (ARES)\n\n- **Flight planning** and execution\n\n- **ATM decision support** systems\n\n\n## Intended Consumers\n\n\n- Airport Operators\n\n- Civil Air Navigation Service Providers (ANSPs)\n\n- Civil Airspace Users (Airlines)\n\n- Military Air Navigation Service Providers\n\n- Military Airspace Users\n\n- Network Manager\n\n- Providers of Data Services\n\n\n## Compliance and Standards\n\n\nThis service is compliant with:\n\n- **EUROCONTROL Specification for SWIM Technical Infrastructure (TI) Yellow Profile**\n\n- **Digital NOTAM Specification v1.0**\n\n- **EUROCAE ED-254** (Service Interface Bindings)\n\n- **EU Implementing Regulation 2021/116** (Common Project One)\n\n- **Commission Implementing Regulation (EU) 2017/373** (Aeronautical data quality)\n\n- **ICAO Annex 15** - Aeronautical Information Services\n\n- **AIXM 5.1.1** coding guidelines (Common and Technical)\n\n\n## Three Service Interfaces\n\n\n1. **Subscription Interface** (WS-Light/REST) - Manage subscriptions via REST API\n\n2. **Distribution Interface** (AMQP 1.0) - Receive real-time event notifications via message broker\n\n3. **Request Interface** (WFS 2.0) - Query current state using OGC Web Feature Service\n\n\n## Information Sources\n\n\nThe service provider ensures that aeronautical data is received from appropriate authorized sources:\n\n- Airport Operators\n\n- Civil/Military Air Navigation Service Providers\n\n- Air Traffic Service Providers\n\n- Communication, Navigation and Surveillance Service Providers\n\n- Airside Ground Handlers\n\n- Owners of Obstacles\n\n\n## Quality of Service\n\n\n### Performance\n\n- **Capacity**: Sufficient to ensure fitness for purpose\n\n- **Response time**: Sufficient to ensure fitness for purpose\n\n\n### Reliability\n\n- **Availability**: Sufficient to ensure fitness for purpose\n\n- **Recoverability**: Sufficient to ensure fitness for purpose\n\n\n### Security\n\n- **Confidentiality**: Ensured through SWIM-TI Yellow Profile (TLS 1.2+)\n\n- **Integrity**: Ensured through SWIM-TI Yellow Profile (TLS 1.2+)\n\n- **Authentication**: X.509 certificates (EACP) or username/password (SASL)\n\n- **Authorization**: SWIM-TIYP-0070 compliant
mp.openapi.extensions.smallrye.info.contact.name=EUROCONTROL
mp.openapi.extensions.smallrye.info.contact.url=https://eur-registry.swim.aero
mp.openapi.extensions.smallrye.info.contact.email=swim@eurocontrol.int

# =============================================================================
# Database (MariaDB)
# =============================================================================
quarkus.datasource.db-kind=mariadb
quarkus.datasource.username=${MARIADB_USERNAME:swim}
quarkus.datasource.password=${MARIADB_PASSWORD:swim}
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.max-size=10
quarkus.hibernate-orm.schema-management.strategy=update
quarkus.hibernate-orm.log.sql=false

%prod.quarkus.datasource.jdbc.url=jdbc:mariadb://${MARIADB_HOST:localhost}:${MARIADB_PORT:3306}/${MARIADB_DATABASE:swim_consumer_validator}

# =============================================================================
# AMQP Broker
# =============================================================================
amqp.broker.enabled=${AMQP_BROKER_ENABLED:true}
amqp.broker.host=${AMQP_BROKER_HOST:localhost}
amqp.broker.port=${AMQP_BROKER_PORT:5672}
amqp.broker.username=${AMQP_BROKER_USERNAME:admin}
amqp.broker.password=${AMQP_BROKER_PASSWORD:admin}

# =============================================================================
# Event Generator
# =============================================================================
event.generator.enabled=${EVENT_GENERATOR_ENABLED:true}
event.generator.schedule=${EVENT_GENERATOR_SCHEDULE:0 */1 * * * ?}
event.generator.events.path=${EVENT_GENERATOR_EVENTS_PATH:/opt/events}

# =============================================================================
# Per-Subscription Heartbeat Publisher (sends heartbeat to {queue}-heartbeat)
# =============================================================================
heartbeat.publisher.enabled=${HEARTBEAT_PUBLISHER_ENABLED:true}
heartbeat.publisher.interval=${HEARTBEAT_PUBLISHER_INTERVAL:15s}

# =============================================================================
# Security (mTLS)
# =============================================================================
quarkus.http.ssl.certificate.files=${QUARKUS_HTTP_SSL_CERTIFICATE_FILES:/certs/server/tls.crt}
quarkus.http.ssl.certificate.key-files=${QUARKUS_HTTP_SSL_CERTIFICATE_KEY_FILES:/certs/server/tls.key}
quarkus.http.ssl.certificate.trust-store-file=${QUARKUS_HTTP_SSL_CERTIFICATE_TRUST_STORE_FILE:/certs/ca/ca.crt}
quarkus.http.ssl.certificate.trust-store-file-type=PEM
quarkus.http.ssl.client-auth=required

quarkus.http.auth.permission.public.paths=/ui/*,/static/*,/q/*,/admin/*
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.authenticated.paths=/swim/*
quarkus.http.auth.permission.authenticated.policy=authenticated

# =============================================================================
# Observability
# =============================================================================
quarkus.log.level=INFO
quarkus.log.category."com.github.swim_developer.validator.dnotam.consumer".level=INFO
quarkus.log.category."io.quarkus".level=INFO
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5p [%c] (%t) %s%e%n

# =============================================================================
# Cache
# =============================================================================
quarkus.cache.caffeine."event-files".maximum-size=10000
quarkus.cache.caffeine."event-files".expire-after-write=1d

# =============================================================================
# Profile: dev
# =============================================================================
%dev.quarkus.http.port=8084
%dev.quarkus.http.insecure-requests=enabled
%dev.quarkus.http.ssl.certificate.files=
%dev.quarkus.http.ssl.certificate.key-files=
%dev.quarkus.http.ssl.certificate.trust-store-file=
%dev.quarkus.http.ssl.client-auth=none
%dev.quarkus.http.auth.permission.authenticated.policy=permit

%dev.quarkus.datasource.devservices.enabled=false
%dev.quarkus.datasource.jdbc.url=jdbc:mariadb://localhost:3307/swim_consumer_validator

%dev.amqp.broker.host=localhost
%dev.amqp.broker.port=5674
%dev.amqp.broker.username=admin
%dev.amqp.broker.password=admin

%dev.event.generator.events.path=src/main/resources/aixm-events
%dev.heartbeat.publisher.interval=30s

%dev.quarkus.log.level=INFO

# =============================================================================
# Profile: test
# =============================================================================
%test.quarkus.http.insecure-requests=enabled
%test.quarkus.http.ssl.certificate.files=
%test.quarkus.http.ssl.certificate.key-files=
%test.quarkus.http.ssl.certificate.trust-store-file=
%test.quarkus.http.ssl.client-auth=none
%test.quarkus.http.auth.permission.authenticated.policy=permit

%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.datasource.devservices.db-name=swim_validator_test
%test.quarkus.datasource.devservices.username=swim
%test.quarkus.datasource.devservices.password=swim

%test.amqp.broker.enabled=false

%test.event.generator.enabled=false
%test.event.generator.events.path=src/test/resources/aixm-events
%test.heartbeat.publisher.enabled=false
