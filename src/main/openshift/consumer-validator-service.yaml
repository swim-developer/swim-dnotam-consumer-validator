apiVersion: v1
kind: Service
metadata:
  name: consumer-validator
  namespace: swim-demo
  labels:
    app: consumer-validator
    app.kubernetes.io/name: consumer-validator
    app.kubernetes.io/part-of: consumer-validator
spec:
  selector:
    app: consumer-validator
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  - name: https
    port: 8443
    targetPort: 8443
    protocol: TCP
  type: ClusterIP

